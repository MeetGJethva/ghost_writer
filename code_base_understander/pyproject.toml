[project]
name = "codebase-context"
version = "0.1.0"
description = "Codebase understanding system using hybrid skeleton + agentic traversal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.13",
    "langchain-openai>=0.2.14",
    "langchain-groq>=0.2.2",
    "click>=8.3.1",
    "networkx>=3.6.1",
    "rich>=14.3.3",
    "tree-sitter==0.20.1",
    "tree-sitter-languages==1.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ctx = "codebase_context.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_context"]