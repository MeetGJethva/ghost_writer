[project]
name = "code-generator"
version = "0.1.0"
description = "Code generation and testing agent system using LangChain + LangGraph + Groq"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "langchain-openai>=1.1.12",
    "langsmith>=0.7.23",
    "jira>=3.10.5",
]

[project.scripts]
code-generator = "code_generator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_generator"]
